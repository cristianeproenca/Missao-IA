<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Você decide o futuro da IA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="caixa-principal">

        <header class="cabecalho">

            <span class="categoria">
                INTELIGÊNCIA ARTIFICIAL
            </span>

            <h1>
                Você decide o futuro da IA
            </h1>

            <p>
                Responda às perguntas e descubra como suas escolhas
                podem refletir diferentes perspectivas sobre o futuro
                da Inteligência Artificial.
            </p>

        </header>

        <div class="progresso">
            <div class="barra-progresso"></div>
        </div>

        <section class="caixa-perguntas"></section>

        <section class="caixa-alternativas"></section>

        <section class="caixa-resultado">

            <span class="titulo-resultado">
                SEU RESULTADO
            </span>

            <p class="texto-resultado"></p>

        </section>

        <footer>
            <span>TECNOLOGIA</span>
            <span>•</span>
            <span>INOVAÇÃO</span>
            <span>•</span>
            <span>FUTURO</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
